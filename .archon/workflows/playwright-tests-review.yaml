name: playwright-tests-review
description: >-
  Review Playwright UI/API test code of the Conduit framework: typecheck and lint, framework conventions,
  test design, reliability and rate-limit cost. Read-only; writes review.md with a verdict to the run artifacts.
  Input: files or folders to review (empty = changed files from git and framework files changed in the last 2 days).

nodes:
  # Deterministic: prepare the workspace, then decide what to review. The workspace is a fresh worktree, so it has no
  # uncommitted changes and every file carries the checkout timestamp: both scans read the main checkout instead.
  - id: scope
    bash: |
      set -e
      bash .archon/scripts/workspace-setup.sh
      echo "Requested scope: $ARGUMENTS"
      main="${PROJECT_PATH:-}"
      if [ -z "$main" ]; then
        common=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || common=""
        [ -n "$common" ] && main=$(dirname "$common")
      fi
      [ -n "$main" ] || main="$PWD"
      echo "Changed files in $main (git status):"
      git -C "$main" status --porcelain --untracked-files=all -- tests src .claude/skills playwright.config.ts
      echo "Framework files changed in the last 2 days:"
      (cd "$main" && find tests src -type f -name '*.ts' -mtime -2 | sort)
      if [ "$main" != "$PWD" ]; then
        echo "NOTE: this workspace is an isolated worktree at HEAD. Files listed above that are uncommitted in the main"
        echo "checkout are NOT present here — review them by passing explicit paths, or commit them first."
      fi

  # Deterministic: compiler and linter results are evidence for the report, so failures do not stop the run.
  - id: static_checks
    depends_on: [scope]
    bash: |
      out=$(npm run --silent typecheck 2>&1); code=$?
      echo "typecheck exit code: $code"
      echo "$out" | tail -40
      out=$(npm run --silent lint 2>&1); code=$?
      echo "lint exit code: $code"
      echo "$out" | tail -40
      exit 0

  - id: review_conventions
    model: '@reviewer'
    command: playwright-review-conventions
    depends_on: [scope]
    context: fresh
    skills: [playwright-ts-conduit-realworld]
    allowed_tools: [Read, Glob, Grep]
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [APPROVE, CHANGES_REQUESTED] }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocker, major, minor] }
              file: { type: string }
              line: { type: integer }
              rule: { type: string }
              problem: { type: string }
              fix: { type: string }
            required: [severity, file, rule, problem, fix]
      required: [verdict, findings]

  - id: review_design
    model: '@reviewer'
    command: playwright-review-test-design
    depends_on: [scope]
    context: fresh
    skills: [playwright-ts-conduit-realworld, playwright-ts-test-results]
    allowed_tools: [Read, Glob, Grep]
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [APPROVE, CHANGES_REQUESTED] }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocker, major, minor] }
              file: { type: string }
              line: { type: integer }
              rule: { type: string }
              problem: { type: string }
              fix: { type: string }
            required: [severity, file, rule, problem, fix]
      required: [verdict, findings]

  # Deterministic: the review runs no tests — copy the report folder of the last test run to the run artifacts and open it.
  - id: allure
    depends_on: [scope]
    bash: bash .archon/scripts/allure-serve.sh

  - id: report
    model: '@general'
    command: playwright-review-report
    depends_on: [static_checks, allure, review_conventions, review_design]
    trigger_rule: all_done
    skills: [playwright-ts-conduit-realworld, playwright-ts-test-results]
    allowed_tools: [Read, Write]
