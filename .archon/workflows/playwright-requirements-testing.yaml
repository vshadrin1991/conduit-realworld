name: playwright-requirements-testing
description: >-
  Test the requirements of the Conduit application from one requirements file: review them with the
  playwright-ts-test-requirements skill (gaps, ambiguity, contradictions, testability), collect evidence from the
  running app in Chrome through the Playwright MCP server, and write tasks/<KEY>/requirements/
  requirements-testing-result.md and test-cases.md. Differences between a requirement and the application are
  questions for the author, not failures; only a blocked review stops the run
  (tasks/<KEY>/requirements/requirements-testing-blocked.md). Input: --requirements|--r <file>.

nodes:
  # Deterministic: prepare the workspace, then --r <file> → inputs.json, a source copy in tasks/<KEY>/requirements/source/, extracted text.
  - id: inputs
    bash: |
      set -e
      bash .archon/scripts/workspace-setup.sh
      mkdir -p "$ARTIFACTS_DIR"
      printf '%s' "$ARGUMENTS" > "$ARTIFACTS_DIR/arguments.txt"
      node .archon/scripts/requirements-inputs.mjs "$ARTIFACTS_DIR/arguments.txt" "$ARTIFACTS_DIR"

  # Deterministic: is the application reachable (one request to the home page) and is Chrome installed?
  - id: preflight
    depends_on: [inputs]
    bash: |
      base="${BASE_URL:-$(grep -E '^BASE_URL=' .env 2>/dev/null | tail -1 | cut -d= -f2-)}"
      base="${base:-https://conduit-realworld-example-app.fly.dev}"
      code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$base/" || true)
      site=DOWN; [ "$code" = 200 ] && site=UP
      chrome=no; { [ -d "/Applications/Google Chrome.app" ] || command -v google-chrome >/dev/null 2>&1; } && chrome=yes
      printf '{"site":"%s","http_status":"%s","base_url":"%s","chrome":"%s"}\n' "$site" "${code:-000}" "$base" "$chrome"

  # Static testing: normalize and review the requirements, plan what the browser can answer.
  - id: review
    model: '@reviewer'
    command: playwright-requirements-review
    depends_on: [inputs]
    context: fresh
    skills: [playwright-ts-test-requirements, playwright-ts-conduit-realworld]
    allowed_tools: [Read, Write, Glob, Grep]
    output_format:
      type: object
      properties:
        status: { type: string, enum: [READY, BLOCKED] }
        summary: { type: string }
        requirements: { type: integer }
        blockers: { type: integer }
        majors: { type: integer }
        minors: { type: integer }
        live_checks: { type: integer }
      required: [status, summary, requirements, blockers, majors, minors, live_checks]

  # Evidence from the running app: opens Chrome through .archon/mcp/playwright.json; differences are questions, not failures.
  - id: evidence
    model: '@reviewer'
    command: playwright-requirements-evidence
    depends_on: [review, preflight]
    when: "$review.output.status == 'READY' && $preflight.output.site == 'UP' && $preflight.output.chrome == 'yes'"
    context: fresh
    mcp: .archon/mcp/playwright.json
    skills: [playwright-ts-test-requirements, playwright-ts-conduit-realworld]
    allowed_tools: [Read, Write, Glob, Grep, Bash]
    output_format:
      type: object
      properties:
        status: { type: string, enum: [COLLECTED, PARTIAL, ENV_BLOCKED] }
        summary: { type: string }
        matches: { type: integer }
        differences: { type: integer }
        not_observed: { type: integer }
      required: [status, summary, matches, differences, not_observed]

  # Deterministic: BLOCKED only when the review did not complete or found blockers; evidence only sets the coverage.
  - id: gate
    depends_on: [review, evidence, preflight]
    trigger_rule: all_done
    bash: |
      node .archon/scripts/requirements-gate.mjs $review.output $evidence.output $preflight.output

  - id: result_report
    model: '@planner'
    command: playwright-requirements-result-report
    depends_on: [gate]
    when: "$gate.output.verdict == 'READY'"
    context: fresh
    skills: [playwright-ts-test-requirements, playwright-ts-conduit-realworld]
    allowed_tools: [Read, Write, Glob, Grep, Bash]

  - id: blocked_report
    model: '@general'
    command: playwright-requirements-blocked-report
    depends_on: [gate]
    when: "$gate.output.verdict == 'BLOCKED'"
    context: fresh
    skills: [playwright-ts-test-requirements]
    allowed_tools: [Read, Write, Glob, Grep, Bash]

  # Deterministic: list the files the run produced and copy tasks/ to the run artifacts — it is gitignored, so it
  # would disappear with the worktree.
  - id: outputs
    depends_on: [result_report, blocked_report]
    trigger_rule: one_success
    bash: |
      dir=$(node -e 'console.log(require(process.argv[1]).outputDir)' "$ARTIFACTS_DIR/inputs.json")
      echo "Result files in $dir (copies in $ARTIFACTS_DIR):"
      found=0
      for file in "$dir"/requirements-testing-result.md "$dir"/test-cases.md "$dir"/requirements-testing-blocked.md; do
        [ -f "$file" ] && { echo "$file"; found=1; }
      done
      [ "$found" = 1 ] || echo "(no result files were written)"
      if [ -d tasks ]; then
        rm -rf "$ARTIFACTS_DIR/tasks"
        mkdir -p "$ARTIFACTS_DIR/tasks"
        cp -R tasks/. "$ARTIFACTS_DIR/tasks/"
        echo "tasks/ copied to $ARTIFACTS_DIR/tasks"
      fi
      exit 0
